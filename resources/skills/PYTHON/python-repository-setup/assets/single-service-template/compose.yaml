# Local stack. Every value a container receives is mapped explicitly from the
# root .env (see .env.example); never `env_file: .env`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host port only; the container port is set by the Dockerfile CMD.
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:?set ENVIRONMENT_NAME}
